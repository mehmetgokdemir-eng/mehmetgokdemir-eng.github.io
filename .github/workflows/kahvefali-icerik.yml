name: Kahve Sirlari icerik uretimi

on:
  schedule:
    # 01:20 UTC = TR 04:20 — yalnizca gunluk burc (backlog 0)
    - cron: '20 1 * * *'
    # 10:00 UTC = TR 13:00, ABD gecesi — agir arsiv uretimi (backlog 150)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      backlog:
        description: 'Bu calismada uretilecek arsiv metni sayisi'
        required: false
        default: '120'
      model:
        description: 'Model listesi (virgulle, bos birakilirsa betikteki varsayilan)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: kahvefali-icerik
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Icerikleri uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKLOG: ${{ github.event.schedule == '20 1 * * *' && '0' || github.event.schedule == '0 10 * * *' && '150' || github.event.inputs.backlog || '120' }}
          MODEL: ${{ github.event.inputs.model || '' }}
        run: node tools/kahvefali/uret.mjs

      - name: Degisiklikleri yayinla
        run: |
          git config user.name  "kahvefali-bot"
          git config user.email "actions@github.com"
          git add kahvefali
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "Kahve Sirlari icerik guncellemesi $(date -u +%Y-%m-%d)"
          # Is calisirken depoya baska commit girdiyse: once onlari al, ustune bin, sonra push.
          # Uc kez dene; icerik klasorune yalnizca bu is yazdigi icin cakisma beklenmez.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push basarisiz, tekrar deneniyor ($i/3)"
            sleep 10
          done
          exit 1
